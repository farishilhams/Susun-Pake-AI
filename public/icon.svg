<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2336"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <!-- Terminal Chevron > -->
  <polyline points="18,22 28,32 18,42" fill="none" stroke="url(#primaryGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Terminal Underscore Cursor _ -->
  <line x1="34" y1="42" x2="48" y2="42" stroke="url(#primaryGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Subtle top glow dot -->
  <circle cx="50" cy="14" r="2.5" fill="#22C55E" opacity="0.8"/>
</svg>